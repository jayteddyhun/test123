<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>국회 생중계 AI 자막 실시간 모니터링</title>
<style>
  :root { color-scheme: light dark; }
  * { -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    max-width: 950px;
    margin: 0 auto;
    padding: 15px;
    padding-top: max(15px, env(safe-area-inset-top));
    padding-bottom: max(15px, env(safe-area-inset-bottom));
    background: #f4f6f9;
    color: #333;
  }
  h2 { margin: 8px 0 15px; color: #0056b3; font-size: 1.25rem; }
  .card {
    background: #fff;
    padding: 15px;
    border-radius: 10px;
    box-shadow: 0 2px 5px rgba(0,0,0,0.08);
    margin-bottom: 15px;
  }
  label { font-weight: bold; font-size: 13px; display: block; margin-bottom: 6px; color: #495057; }
  input[type="text"] {
    width: 100%;
    padding: 11px;
    box-sizing: border-box;
    border: 1px solid #ced4da;
    border-radius: 6px;
    margin-bottom: 12px;
    font-size: 16px; /* iOS에서 16px 미만이면 자동 확대됨 - 방지 */
  }
  .btn-group { display: flex; gap: 10px; flex-wrap: wrap; }
  button {
    flex: 1;
    min-width: 140px;
    padding: 14px 15px;
    border: none;
    border-radius: 6px;
    font-weight: bold;
    cursor: pointer;
    color: #fff;
    font-size: 15px;
  }
  .btn-connect { background: #007bff; }
  .btn-disconnect { background: #dc3545; }
  .btn-csv { background: #28a745; }
  #status {
    font-weight: bold;
    padding: 6px 12px;
    border-radius: 20px;
    display: inline-block;
    font-size: 12px;
    margin-bottom: 12px;
  }
  .status-disconnected { background: #e2e3e5; color: #383d41; }
  .status-connected { background: #d4edda; color: #155724; }
  .status-connecting { background: #fff3cd; color: #856404; }
  #log-container {
    height: 55vh;
    min-height: 300px;
    background: #1e1e1e;
    color: #d4d4d4;
    font-family: 'Consolas', 'Courier New', monospace;
    font-size: 13px;
    padding: 12px;
    border-radius: 8px;
    overflow-y: auto;
    white-space: pre-wrap;
    word-break: break-word;
    line-height: 1.6;
    -webkit-overflow-scrolling: touch;
  }
  .log-alert {
    color: #ff6b6b;
    font-weight: bold;
    background: rgba(255, 107, 107, 0.12);
    display: block;
    padding: 6px 8px;
    border-radius: 4px;
    margin: 4px 0;
    border-left: 3px solid #ff6b6b;
  }
  .log-sys { color: #888; }
</style>
</head>
<body>
<h2>🎙️ 국회 생중계 AI 자막 모니터링</h2>

<div class="card">
  <label>자막 소켓 주소 (상임위마다 경로가 다름: .../aistt/____/hls)</label>
  <input type="text" id="ws-url" value="wss://smiai.webcast.go.kr:8091/aistt/gwabang/hls">

  <label>감지 키워드 (쉼표로 구분)</label>
  <input type="text" id="keywords-input" value="앱 마켓, 플랫폼, 과징금, 구글, 애플, 인앱결제, 수수료">

  <div>
    <span id="status" class="status-disconnected">🔴 연결 끊김</span>
  </div>
  <div class="btn-group">
    <button id="btn-toggle" class="btn-connect">모니터링 시작</button>
    <button id="btn-csv" class="btn-csv">📥 CSV 다운로드</button>
  </div>
</div>

<div class="card">
  <label>실시간 자막 / 키워드 감지 로그</label>
  <div id="log-container">대기 중... [모니터링 시작]을 누르면 자막을 수신합니다.</div>
</div>

<script>
  let ws = null;
  let collectedData = [];
  let lastTranscript = "";
  let manualClose = false;

  const $ = (id) => document.getElementById(id);

  // ---- 유사매칭용 정규화: 공백/조사/특수문자 제거 ----
  function normalize(s) {
    return (s || "").replace(/[^가-힣a-zA-Z0-9]/g, "").toLowerCase();
  }

  function logMessage(text, cls) {
    const container = $('log-container');
    if (container.dataset.cleared !== "1") {
      container.innerText = "";
      container.dataset.cleared = "1";
    }
    const t = new Date().toLocaleTimeString();
    if (cls === "alert") {
      const span = document.createElement("span");
      span.className = "log-alert";
      span.textContent = "[" + t + "] 🔴 " + text;
      container.appendChild(span);
    } else if (cls === "sys") {
      const span = document.createElement("span");
      span.className = "log-sys";
      span.textContent = "[" + t + "] " + text + "\n";
      container.appendChild(span);
    } else {
      container.appendChild(document.createTextNode("[" + t + "] " + text + "\n"));
    }
    container.scrollTop = container.scrollHeight;
  }

  function setStatus(cls, text) {
    const s = $('status');
    s.className = cls;
    s.innerText = text;
  }

  function startConnection() {
    const wsUrl = $('ws-url').value.trim();
    if (!wsUrl.startsWith("wss://") && !wsUrl.startsWith("ws://")) {
      logMessage("주소는 wss:// 로 시작해야 합니다.", "sys");
      return;
    }

    manualClose = false;
    setStatus("status-connecting", "🟡 연결 시도 중...");
    logMessage("접속: " + wsUrl, "sys");

    try {
      ws = new WebSocket(wsUrl);
    } catch (e) {
      logMessage("연결 생성 실패: " + e.message, "sys");
      setStatus("status-disconnected", "🔴 연결 끊김");
      return;
    }

    ws.onopen = () => {
      setStatus("status-connected", "🟢 실시간 수신 중");
      $('btn-toggle').className = "btn-disconnect";
      $('btn-toggle').innerText = "모니터링 중지";
      logMessage("연결 성공! 자막 수신 시작.", "sys");
    };

    ws.onmessage = (event) => {
      let data;
      try { data = JSON.parse(event.data); } catch (e) { return; }

      const transcript = (data.transcript || "").trim();
      if (!transcript) return;
      if (data.final === false) return;          // 확정 문장만
      if (transcript === lastTranscript) return; // 바로 앞과 같으면 중복
      lastTranscript = transcript;

      // 키워드 검사 (유사매칭)
      const kwInput = $('keywords-input').value;
      const keywords = kwInput.split(',').map(k => k.trim()).filter(k => k);
      const normText = normalize(transcript);
      const matched = keywords.filter(kw => {
        const nk = normalize(kw);
        return nk && normText.includes(nk);
      });

      const timeStr = new Date().toLocaleTimeString();
      collectedData.push({
        time: timeStr,
        keyword: matched.join(' '),
        text: transcript
      });

      if (matched.length > 0) {
        logMessage("[" + matched.join(', ') + "]\n   " + transcript, "alert");
      } else {
        logMessage(transcript);
      }
    };

    ws.onerror = () => {
      logMessage("⚠️ 웹소켓 오류. (아이폰에서는 국회 서버 인증서 문제로 막힐 수 있습니다)", "sys");
    };

    ws.onclose = () => {
      setStatus("status-disconnected", "🔴 연결 끊김");
      $('btn-toggle').className = "btn-connect";
      $('btn-toggle').innerText = "모니터링 시작";
      if (!manualClose) {
        logMessage("연결 종료됨. 3초 뒤 재연결 시도...", "sys");
        setTimeout(() => { if (!manualClose) startConnection(); }, 3000);
      } else {
        logMessage("연결을 중지했습니다.", "sys");
      }
    };
  }

  function toggleConnection() {
    if (ws && ws.readyState === WebSocket.OPEN) {
      manualClose = true;
      ws.close();
      return;
    }
    startConnection();
  }

  function downloadCSV() {
    if (collectedData.length === 0) {
      alert("다운로드할 데이터가 없습니다.");
      return;
    }
    let csv = "\uFEFF시간,키워드,발언내용\n";
    collectedData.forEach(row => {
      const text = (row.text || "").replace(/"/g, '""');
      const kw = (row.keyword || "").replace(/"/g, '""');
      csv += '"' + row.time + '","' + kw + '","' + text + '"\n';
    });
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = "국감회의록_" + new Date().toISOString().slice(0, 10) + ".csv";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  }

  // 이벤트 연결 (onclick 속성 대신 - 더 안정적)
  $('btn-toggle').addEventListener('click', toggleConnection);
  $('btn-csv').addEventListener('click', downloadCSV);
</script>
</body>
</html>
