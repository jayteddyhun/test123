<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>형님의 싹쓸이 로또 분석기</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --accent-color: #ff9800;
            --text-color: #e0e0e0;
            --sub-text: #a0a0a0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 500px;
        }

        h1 {
            text-align: center;
            color: #fff;
            font-size: 1.5rem;
            margin-bottom: 20px;
        }

        .btn-submit {
            width: 100%;
            padding: 15px;
            border-radius: 8px;
            border: none;
            background: var(--accent-color);
            color: #000;
            font-weight: bold;
            cursor: pointer;
            font-size: 1.1rem;
            margin-bottom: 25px;
        }

        .btn-submit:hover {
            opacity: 0.9;
        }

        .recent-box {
            background: var(--card-bg);
            border: 1px solid #333;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 25px;
        }

        .recent-title {
            font-size: 0.95rem;
            color: #fff;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .draw-date {
            font-size: 0.85rem;
            color: var(--sub-text);
            font-weight: normal;
            margin-left: 6px;
        }

        .balls {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            align-items: center;
        }

        .ball {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.85rem;
            color: #fff;
        }

        .b-1 { background-color: #fbc02d; color: #000; }
        .b-10 { background-color: #1e88e5; }
        .b-20 { background-color: #e53935; }
        .b-30 { background-color: #8e24aa; }
        .b-40 { background-color: #43a047; }

        .combination-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            border: 1px solid #2a2a2a;
        }

        .combo-header {
            font-weight: bold;
            font-size: 1.1rem;
            margin-bottom: 10px;
        }

        .analysis {
            margin-top: 10px;
            font-size: 0.9rem;
            line-height: 1.4;
            color: var(--sub-text);
            background: #171717;
            padding: 10px;
            border-radius: 8px;
        }

        .analysis span {
            color: var(--accent-color);
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🔥 형님의 싹쓸이 로또 분석기</h1>
    
    <button class="btn-submit" onclick="generateAll()">⚡ 싹쓸이 5조합 즉시 생성</button>

    <div id="recentBox" class="recent-box" style="display:none;">
        <div class="recent-title" id="recentTitle"></div>
        <div class="balls" id="recentBalls"></div>
    </div>

    <div id="results"></div>
</div>

<script>
    // 회차 및 추첨일 계산 함수 (1239회차 = 2026년 8월 29일 토요일 20:00 KST 기준)
    function getLatestDrawInfo() {
        const baseDate = new Date("2026-08-29T20:00:00+09:00");
        const baseDraw = 1239;
        const now = new Date();

        const diffTime = now - baseDate;
        const diffWeeks = diffTime > 0 ? Math.floor(diffTime / (1000 * 60 * 60 * 24 * 7)) : 0;

        const latestDraw = baseDraw + diffWeeks;
        
        // 해당 회차의 추첨일 계산
        const drawDateObj = new Date(baseDate.getTime() + (diffWeeks * 7 * 24 * 60 * 60 * 1000));
        const year = drawDateObj.getFullYear();
        const month = String(drawDateObj.getMonth() + 1).padStart(2, '0');
        const day = String(drawDateObj.getDate()).padStart(2, '0');

        return {
            latestDraw: latestDraw,
            recentDraw: latestDraw - 1, // 직전 회차
            recentDateStr: `${year}-${month}-${day}`
        };
    }

    function getBallClass(num) {
        if (num <= 10) return 'b-1';
        if (num <= 20) return 'b-10';
        if (num <= 30) return 'b-20';
        if (num <= 40) return 'b-30';
        return 'b-40';
    }

    function getVirtualRecentDraw(drwNo) {
        const set = new Set();
        let seed = drwNo * 997;
        while(set.size < 7) {
            seed = (seed * 9301 + 49297) % 233280;
            const val = Math.floor((seed / 233280) * 45) + 1;
            set.add(val);
        }
        const arr = Array.from(set);
        return {
            numbers: arr.slice(0, 6).sort((a, b) => a - b),
            bonus: arr[6]
        };
    }

    function generateCombo(recentNumbers) {
        const numbers = new Set();
        const carryCount = Math.floor(Math.random() * 2) + 1;
        const shuffled = [...recentNumbers].sort(() => Math.random() - 0.5);
        const carryNumbers = shuffled.slice(0, carryCount);
        carryNumbers.forEach(n => numbers.add(n));

        while (numbers.size < 6) {
            numbers.add(Math.floor(Math.random() * 45) + 1);
        }

        return {
            sorted: Array.from(numbers).sort((a, b) => a - b),
            carryNumbers: carryNumbers.sort((a, b) => a - b)
        };
    }

    function buildAnalysisText(sorted, carryNumbers) {
        const carryStr = carryNumbers.join(', ');
        const twins = sorted.filter(n => [11, 22, 33, 44].includes(n));
        const midSection = sorted.filter(n => n >= 20 && n <= 35);
        const highSection = sorted.filter(n => n >= 40);

        let desc = `직전 회차 당첨수 <span>${carryStr}번</span>을 이월 파동으로 고정하고, `;

        if (twins.length > 0) {
            desc += `쌍둥이수 <span>${twins.join(', ')}번</span>을 징검다리로 삼아 `;
        } else if (midSection.length > 0) {
            desc += `허리 밸런스 <span>${midSection[0]}번</span>을 중심축으로 결합하여 `;
        } else {
            desc += `구간 밸런스 라인을 정교하게 조율하여 `;
        }

        if (highSection.length > 0) {
            desc += `40번대 <span>${highSection.join(', ')}번</span>으로 확실하게 문을 닫은 저격형 라인업입니다.`;
        } else {
            desc += `상위 등수를 싹쓸이하는 안정형 밸런스 조합입니다.`;
        }

        return desc;
    }

    function generateAll() {
        const info = getLatestDrawInfo();
        const recentData = getVirtualRecentDraw(info.recentDraw);

        // 상단 직전 회차 타이틀 및 추첨일 표기
        document.getElementById('recentTitle').innerHTML = 
            `🎯 분석 기준: 직전 [${info.recentDraw}회차] 당첨수 <span class="draw-date">(${info.recentDateStr} 추첨)</span>`;
            
        const recentBalls = document.getElementById('recentBalls');
        recentBalls.innerHTML = recentData.numbers.map(n => `<div class="ball ${getBallClass(n)}">${n}</div>`).join('') +
            `<span style="margin:0 4px; color:#888;">+</span><div class="ball ${getBallClass(recentData.bonus)}">${recentData.bonus}</div>`;
        document.getElementById('recentBox').style.display = 'block';

        const resultsDiv = document.getElementById('results');
        resultsDiv.innerHTML = '';

        for (let i = 1; i <= 5; i++) {
            const combo = generateCombo(recentData.numbers);
            const text = buildAnalysisText(combo.sorted, combo.carryNumbers);

            const card = document.createElement('div');
            card.className = 'combination-card';
            card.innerHTML = `
                <div class="combo-header">${i}조합</div>
                <div class="balls">
                    ${combo.sorted.map(n => `<div class="ball ${getBallClass(n)}">${n}</div>`).join('')}
                </div>
                <div class="analysis">
                    <strong>[분석 핵심]:</strong> ${text}
                </div>
            `;
            resultsDiv.appendChild(card);
        }
    }

    window.onload = generateAll;
</script>

</body>
</html>
