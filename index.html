<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>형님의 싹쓸이 로또 분석기</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --accent-color: #ff9800;
            --text-color: #e0e0e0;
            --sub-text: #a0a0a0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 500px;
        }

        h1 {
            text-align: center;
            color: #fff;
            font-size: 1.5rem;
            margin-bottom: 20px;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #333;
            background: #2a2a2a;
            color: #fff;
            font-size: 1rem;
        }

        button {
            padding: 12px 20px;
            border-radius: 8px;
            border: none;
            background: var(--accent-color);
            color: #000;
            font-weight: bold;
            cursor: pointer;
            font-size: 1rem;
        }

        button:hover {
            opacity: 0.9;
        }

        .recent-box {
            background: var(--card-bg);
            border: 1px solid #333;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 25px;
        }

        .recent-title {
            font-size: 0.9rem;
            color: var(--sub-text);
            margin-bottom: 10px;
        }

        .balls {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            align-items: center;
        }

        .ball {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.85rem;
            color: #fff;
        }

        .b-1 { background-color: #fbc02d; color: #000; }
        .b-10 { background-color: #1e88e5; }
        .b-20 { background-color: #e53935; }
        .b-30 { background-color: #8e24aa; }
        .b-40 { background-color: #43a047; }

        .combination-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            border: 1px solid #2a2a2a;
        }

        .combo-header {
            font-weight: bold;
            font-size: 1.1rem;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .analysis {
            margin-top: 10px;
            font-size: 0.9rem;
            line-height: 1.4;
            color: var(--sub-text);
            background: #171717;
            padding: 10px;
            border-radius: 8px;
        }

        .analysis span {
            color: var(--accent-color);
            font-weight: bold;
        }

        #loading {
            text-align: center;
            display: none;
            margin: 20px 0;
            color: var(--accent-color);
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🔥 형님의 싹쓸이 로또 분석기</h1>
    
    <div class="controls">
        <input type="number" id="drwNoInput" placeholder="회차 입력 (미입력 시 계산)">
        <button onclick="fetchAndGenerate()">조합 생성</button>
    </div>

    <div id="loading">동행복권 공홈 서버 연결 중...</div>

    <div id="recentBox" class="recent-box" style="display:none;">
        <div class="recent-title" id="recentTitle">직전 회차 당첨 번호</div>
        <div class="balls" id="recentBalls"></div>
    </div>

    <div id="results"></div>
</div>

<script>
    // 날짜 기반 대략적인 최신 회차 계산 함수 (1회차: 2002-12-07 20:00 KST)
    function getEstimatedLatestDraw() {
        const firstDrawDate = new Date("2002-12-07T20:00:00+09:00");
        const now = new Date();
        const diffWeeks = Math.floor((now - firstDrawDate) / (1000 * 60 * 60 * 24 * 7));
        return diffWeeks + 1;
    }

    function getBallClass(num) {
        if (num <= 10) return 'b-1';
        if (num <= 20) return 'b-10';
        if (num <= 30) return 'b-20';
        if (num <= 40) return 'b-30';
        return 'b-40';
    }

    async function fetchWinningNumbers(drwNo) {
        const targetUrl = `https://www.dhlottery.co.kr/common.do?method=getLottoNumber&drwNo=${drwNo}`;
        // CORS 문제 해결을 위한 프록시 경유
        const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(targetUrl)}`;
        
        const response = await fetch(proxyUrl);
        const data = await response.json();
        const lottoData = JSON.parse(data.contents);

        if (lottoData.returnValue !== "success") {
            throw new Error("해당 회차 데이터가 없습니다.");
        }

        return {
            drwNo: lottoData.drwNo,
            numbers: [
                lottoData.drwtNo1, lottoData.drwtNo2, lottoData.drwtNo3,
                lottoData.drwtNo4, lottoData.drwtNo5, lottoData.drwtNo6
            ],
            bonus: lottoData.bnusNo
        };
    }

    function generateSingleCombo(recentNumbers, bonusNum) {
        const numbers = new Set();
        
        // 1. 이월수 1~2개 선택
        const carryCount = Math.floor(Math.random() * 2) + 1;
        const shuffledRecent = [...recentNumbers].sort(() => 0.5 - Math.random());
        const carryNumbers = shuffledRecent.slice(0, carryCount);
        carryNumbers.forEach(n => numbers.add(n));

        // 2. 나머지 난수 채우기
        while (numbers.size < 6) {
            numbers.add(Math.floor(Math.random() * 45) + 1);
        }

        const sorted = Array.from(numbers).sort((a, b) => a - b);
        return { sorted, carryNumbers };
    }

    function buildAnalysisText(combo, carryNumbers, bonusNum) {
        const sorted = combo.sorted;
        const carryStr = carryNumbers.join(', ');
        
        // 특수 번호 및 구간 찾기
        const twins = sorted.filter(n => [11, 22, 33, 44].includes(n));
        const midSection = sorted.filter(n => n >= 20 && n <= 35);
        const highSection = sorted.filter(n => n >= 40);

        let desc = `직전 회차 당첨수 <span>${carryStr}번</span>을 이월 파동으로 굳건히 고정하고, `;

        if (twins.length > 0) {
            desc += `쌍둥이수 <span>${twins.join(', ')}번</span>을 징검다리로 삼아 `;
        } else if (midSection.length > 0) {
            desc += `허리 밸런스 <span>${midSection[0]}번</span>을 중심축으로 결합하여 `;
        } else {
            desc += `구간 밸런스 라인을 정교하게 조율하여 `;
        }

        if (highSection.length > 0) {
            desc += `40번대 <span>${highSection.join(', ')}번</span>으로 확실하게 문을 닫은 상위 등수 저격형 조합입니다.`;
        } else {
            desc += `상위 등수를 싹쓸이하는 안정형 밸런스 라인업입니다.`;
        }

        return desc;
    }

    async function fetchAndGenerate() {
        const inputVal = document.getElementById('drwNoInput').value;
        const drwNo = inputVal ? parseInt(inputVal) : getEstimatedLatestDraw();
        
        const loading = document.getElementById('loading');
        const recentBox = document.getElementById('recentBox');
        const resultsDiv = document.getElementById('results');
        
        loading.style.display = 'block';
        resultsDiv.innerHTML = '';

        try {
            const data = await fetchWinningNumbers(drwNo);
            
            // 직전회차 UI 업데이트
            document.getElementById('recentTitle').innerText = `직전 [${data.drwNo}회차] 당첨 번호`;
            const recentBalls = document.getElementById('recentBalls');
            recentBalls.innerHTML = data.numbers.map(n => `<div class="ball ${getBallClass(n)}">${n}</div>`).join('') +
                `<span style="margin:0 5px;">+</span><div class="ball ${getBallClass(data.bonus)}">${data.bonus}</div>`;
            recentBox.style.display = 'block';

            // 5개 조합 생성 및 UI 출력
            for (let i = 1; i <= 5; i++) {
                const combo = generateSingleCombo(data.numbers, data.bonus);
                const analysisText = buildAnalysisText(combo, combo.carryNumbers, data.bonus);

                const card = document.createElement('div');
                card.className = 'combination-card';
                card.innerHTML = `
                    <div class="combo-header">
                        <span>${i}조합</span>
                    </div>
                    <div class="balls">
                        ${combo.sorted.map(n => `<div class="ball ${getBallClass(n)}">${n}</div>`).join('')}
                    </div>
                    <div class="analysis">
                        <strong>[분석 핵심]:</strong> ${analysisText}
                    </div>
                `;
                resultsDiv.appendChild(card);
            }
        } catch (err) {
            alert(err.message || "공홈 데이터 로딩 실패. 회차 번호를 확인해 주세요.");
        } finally {
            loading.style.display = 'none';
        }
    }

    // 초기화 시 자동 실행
    window.onload = () => fetchAndGenerate();
</script>

</body>
</html>
